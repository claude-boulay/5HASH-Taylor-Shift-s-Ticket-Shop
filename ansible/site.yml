---
- name: Déployer Taylor Shift's Ticket Shop
  hosts: webservers
  gather_facts: false

  pre_tasks:
    - name: Vérifier ou installer Python 3
      ansible.builtin.raw: test -x /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Collecter les facts, maintenant que Python existe
      ansible.builtin.setup:

    - name: Déterminer l'adresse IP réelle de cette instance sur le réseau Floci
      ansible.builtin.set_fact:
        instance_real_ip: "{{ ansible_facts['eth1']['ipv4']['address'] }}"

  roles:
    - role: geerlingguy.docker
      vars:
        docker_daemon_options:
          storage-driver: vfs
    - prestashop

  post_tasks:
    - name: Enregistrer cette instance dans le groupe de cibles de l'ALB
      ansible.builtin.command:
        cmd: >-
          aws --endpoint-url http://localhost.floci.io:4566
          elbv2 register-targets
          --target-group-arn {{ alb_target_group_arn }}
          --targets Id={{ instance_real_ip }}
      delegate_to: localhost
      environment:
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1
      changed_when: false
